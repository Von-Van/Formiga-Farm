name: release

on:
  push:
    tags: ["v*"]
  # A change to the packaging builds every package without publishing anything, so a release is
  # never the first time the packaging runs.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/package-*"

permissions:
  contents: write

jobs:
  package-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/package-macos.sh
        env:
          FORMIGA_FARM_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          FORMIGA_FARM_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Formiga-Farm-*-macOS-universal.dmg
            dist/Formiga-Farm-*-macOS-universal.dmg.sha256
            dist/Formiga-Farm-*-macOS-universal.zip
            dist/Formiga-Farm-*-macOS-universal.zip.sha256

  package-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: dotnet tool install --global wix --version 4.0.5
      - shell: pwsh
        run: ./scripts/package-windows.ps1
        env:
          FORMIGA_FARM_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Formiga-Farm-*-windows-x64.msi
            dist/Formiga-Farm-*-windows-x64.msi.sha256
            dist/Formiga-Farm-*-windows-x64.zip
            dist/Formiga-Farm-*-windows-x64.zip.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version and take its notes from the changelog
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The tag must be the version the app reports, or Desktop would see another.
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "The tag says $version but Cargo.toml says $crate" >&2
            exit 1
          fi
          # This version's notes are its section of the changelog.
          awk -v want="## $version" '
            /^## / { if (found) exit; if ($0 == want || index($0, want " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\nUnsigned build. A SHA-256 checksum file is included for every download.\n' >> notes.md
          # A tag whose message carries the line "Formiga-Release: draft" publishes a draft, seen
          # only by the repository's owners until it is published, so every app of a joint release
          # can be tried before any goes out. The checkout keeps only the commit, so fetch the tag.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A lightweight tag has no message of its own, and %(contents) would read its commit's.
          if [ "$(git cat-file -t "$TAG")" = tag ] && git tag -l --format='%(contents)' "$TAG" | grep -qx 'Formiga-Release: draft'; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          draft: ${{ steps.notes.outputs.draft == 'true' }}
          files: release/*
