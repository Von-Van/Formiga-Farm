[workspace]
members = [
    "crates/formiga-farm",
    "crates/formiga-farm-contract",
    "crates/formiga-forms",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all three from the same Desktop release so their types agree.
# Move all three to a new release's tag together.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.66.6" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.66.6" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", tag = "v0.66.6" }

formiga-farm-contract = { path = "crates/formiga-farm-contract" }
formiga-forms = { path = "crates/formiga-forms" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

# Drawing is pixel by pixel; even a debug build draws it at a usable speed.
[profile.dev.package.formiga-forms]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
